; ══════════════════════════════════════════════════════
;  MeowKit v1.0.4  ·  ESP32-S3-WROOM-1-N16R8
;  16 MB Flash (QIO)  ·  8 MB OPI PSRAM  ·  LVGL 8.3
; ══════════════════════════════════════════════════════

[env:esp32s3box]
platform               = espressif32@6.0.1
board                  = esp32s3box
framework              = arduino

; ── Flash & Partition ────────────────────────────────
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.partitions = partitions_16mb.csv

; ── Serial Monitor ───────────────────────────────────
monitor_speed          = 115200

; ── Upload ───────────────────────────────────────────
upload_protocol        = esptool
upload_speed           = 921600
board_upload.before_reset = no_reset
board_upload.after_reset  = hard_reset

; ── Assets ───────────────────────────────────────────
extra_scripts =
    pre:build_scripts/embed_gif.py              ; GIF → .incbin, no C array needed
    pre:build_scripts/native_usb_upload.py      ; CDC 1200bps → ROM USB download port
    pre:build_scripts/usb_framework_fixes.py     ; bounded CDC TX and USB control callbacks

; ── Build ────────────────────────────────────────────
build_unflags =
    -std=gnu++11
    -DARDUINO_USB_MODE=1

build_flags =
    -std=gnu++17
    -I${PROJECT_SRC_DIR}/ui
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=0             
    -DARDUINO_USB_CDC_ON_BOOT=1       
    -DMEOW_USB_VID=0x303A
    -DMEOW_USB_PID=0x0002
    -DARDUINO_LOOP_STACK_SIZE=16384
    -Wl,-zmuldefs                     
    -DCORE_DEBUG_LEVEL=3              
    -O2

